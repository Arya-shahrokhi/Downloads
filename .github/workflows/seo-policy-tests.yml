name: SEO policy tests

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "seo/**"

jobs:
  seo-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test canonical URL and robots policies
        run: node --test shared/seo/urls.test.js
